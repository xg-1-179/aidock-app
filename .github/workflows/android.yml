name: android

on:
  push:
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'packages/dsh_link_protocol/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Scaffold android platform
        run: |
          cd app
          flutter create --platforms=android --project-name aidock --org com.aidock .
          python3 ../scripts/patch_android_manifest.py
          flutter pub get

      - name: Analyze
        run: cd app && flutter analyze --no-fatal-infos || true

      - name: Build release APK
        run: cd app && flutter build apk --release

      - name: Collect artifact
        run: |
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/app-release.apk out/AIDock-${GITHUB_SHA::7}.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: aidock-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: AIDock 测试包 build ${{ github.run_number }}
          files: out/*.apk
          body: |
            自动构建的 AIDock 安卓安装包。
            安装包文件：`AIDock-${{ github.sha }}.apk`（构建 ${{ github.run_number }}）
          draft: false
          prerelease: true
