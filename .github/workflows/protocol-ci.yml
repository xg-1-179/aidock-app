name: protocol-ci

on:
  push:
    paths:
      - 'packages/dsh_link_protocol/**'
      - '.github/workflows/protocol-ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dsh_link_protocol
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: 安装依赖
        run: dart pub get
      - name: 协议向量测试（必须全绿）
        run: dart test --reporter=expanded
      - name: 静态检查（不阻塞）
        run: dart analyze || true
